<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간호 학습 · 재난·응급 시뮬레이션</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9D%A4%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel-2: #20242d; --line: #2c313c;
    --ink: #eef0f3; --ink-2: #a3a9b5; --accent: #4c9bff;
    --good: #4fd36a; --warn: #fbb315; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  .hidden { display: none !important; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(15,17,21,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .hbar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 800; letter-spacing: -0.01em; }
  .who { margin-left: auto; font-size: 13px; color: var(--ink-2); text-align: right; }
  .who button { background: none; border: 0; color: var(--ink-2); text-decoration: underline; font-size: 13px; padding: 0 0 0 6px; }
  nav { max-width: 1100px; margin: 0 auto; padding: 0 10px 8px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  nav a { flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 14px; border: 1px solid transparent; }
  nav a.on { color: var(--ink); border-color: var(--line); background: var(--panel-2); font-weight: 700; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 70px; }
  h1 { font-size: 24px; margin: 0 0 4px; } h2 { font-size: 19px; margin: 0 0 10px; } h3 { font-size: 16px; margin: 0 0 6px; }
  .sub { color: var(--ink-2); font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .tile { display: block; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .tile:hover { border-color: var(--accent); }
  .tile .ic { font-size: 26px; }
  .tile .st { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 14px; }
  label.f { display: block; font-size: 14px; color: var(--ink-2); margin: 10px 0 4px; }
  input[type=text], input[type=password], select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; } @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid var(--line); background: transparent; }
  .tabs button[aria-selected=true] { background: var(--panel-2); border-color: var(--ink-2); font-weight: 700; }
  .msg { min-height: 22px; font-size: 14px; margin-top: 8px; } .msg.err { color: var(--bad); }
  .stack > * + * { margin-top: 12px; }
  /* 퀴즈 */
  .q { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .q .no { font-size: 13px; color: var(--ink-2); }
  .q .stem { font-weight: 700; margin: 4px 0 10px; }
  .q label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; }
  .q label:hover { background: var(--panel-2); }
  .q input { margin-top: 6px; transform: scale(1.15); }
  .q label.right { border-color: var(--good); background: rgba(79,211,106,.08); }
  .q label.wrong { border-color: var(--bad); background: rgba(255,107,107,.08); }
  .q .exp { margin-top: 10px; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .mark { font-weight: 800; } .mark.ok { color: var(--good); } .mark.no { color: var(--bad); }
  .score { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  /* 술기 */
  .steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
  .steps li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); align-items: start; }
  .steps li .n { width: 30px; height: 30px; border-radius: 8px; background: var(--panel-2); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .steps li.star .n { background: #3a2a0c; color: var(--warn); outline: 1px solid var(--warn); }
  .steps li label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .steps li input { margin-top: 6px; transform: scale(1.2); flex: 0 0 auto; }
  .steps li.done .txt { color: var(--ink-2); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.25); }
  .steps .note { font-size: 13px; color: var(--ink-2); margin-top: 4px; background: var(--panel-2); border-radius: 8px; padding: 6px 10px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.star { color: var(--warn); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 13px; background: var(--panel-2); border-radius: 999px; padding: 2px 10px; }
  .prog { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; margin-top: 8px; }
  .prog i { display: block; height: 100%; background: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); } th { color: var(--ink-2); font-weight: 500; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .end-A { color: var(--good); } .end-B { color: var(--warn); } .end-C, .end-D, .end-E { color: var(--bad); }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #2a2f39; border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 50; }
  .sticky-bar { position: sticky; bottom: 0; background: rgba(15,17,21,.95); border-top: 1px solid var(--line); padding: 10px 0; margin-top: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
<header class="hidden" id="hdr">
  <div class="hbar"><span class="brand">🩺 간호 학습</span><span class="who" id="who"></span></div>
  <nav id="nav">
    <a href="#home">홈</a><a href="#pretest">사전학습 퀴즈</a><a href="#bank">문제은행</a><a href="#wrong">오답노트</a>
    <a href="#skills">핵심술기</a><a href="sim.html">시뮬레이션</a><a href="#me">내 기록</a>
  </nav>
</header>
<main id="main"></main>

<script src="skills.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyzkpBY382Mk6K7xkDGeG-ZnCpCqLiThpim0p-NMxfwHOnp8QCZpg2zH2ygN28gvm17yg/exec';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const M = () => $('main');
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
const fmtDate = (d) => d ? new Date(d).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

/* ── 세션 (시뮬레이션과 공유) ── */
let session = JSON.parse(sessionStorage.getItem('simSession') || 'null') || {};
const saveSession = () => sessionStorage.setItem('simSession', JSON.stringify(session));
const loggedIn = () => !!session.token;

async function api(action, body = {}) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, token: session.token }, body)) });
  const j = await res.json();
  if (!j.ok) {
    if (/로그인이 만료/.test(j.error || '')) { session = {}; saveSession(); toast('로그인이 만료되었습니다.'); route(); }
    throw new Error(j.error || '서버 오류');
  }
  return j;
}
const loading = (t = '불러오는 중…') => { M().innerHTML = `<p class="sub">${t}</p>`; };
const needLogin = () => { M().innerHTML = `<div class="card"><h2>로그인이 필요합니다</h2><p class="sub">퀴즈·오답노트·기록은 로그인해야 저장됩니다.</p>
  <div class="actions" style="justify-content:flex-start"><button class="btn primary" onclick="logout()">로그인하러 가기</button></div></div>`; };

/* ── 로그인 ── */
function viewLogin() {
  $('hdr').classList.add('hidden');
  M().innerHTML = `
    <h1>🩺 간호 학습</h1><p class="sub">재난·응급 분기형 시뮬레이션 · 핵심술기 · 문제은행</p>
    <div class="card" style="max-width:520px;margin-top:16px">
      <div class="tabs"><button id="tL" aria-selected="true">로그인</button><button id="tR" aria-selected="false">회원가입</button></div>
      <form id="fL"><label class="f">학번</label><input type="text" name="studentNo" autocomplete="username" required>
        <label class="f">비밀번호</label><input type="password" name="password" autocomplete="current-password" required>
        <div class="actions"><button class="btn primary">로그인</button></div></form>
      <form id="fR" class="hidden"><div class="grid2">
        <div><label class="f">학번 *</label><input type="text" name="studentNo" required></div>
        <div><label class="f">이름 *</label><input type="text" name="name" required></div>
        <div><label class="f">비밀번호 * (6자 이상)</label><input type="password" name="password" minlength="6" required></div>
        <div><label class="f">분반 코드 *</label><input type="text" name="classCode" required></div>
        <div><label class="f">학교</label><input type="text" name="school"></div>
        <div><label class="f">학과</label><input type="text" name="dept"></div>
        <div><label class="f">학년</label><select name="grade"><option></option><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div>
        <label style="display:flex;gap:8px;margin-top:12px;font-size:14px"><input type="checkbox" name="consent"> 학습 기록(문제 풀이, 시뮬레이션 선택·응답 시간, 술기 체크, 성찰)과 학번·이름 수집에 동의합니다. 수업 운영과 디브리핑에만 사용합니다.</label>
        <div class="actions"><button class="btn primary">가입하기</button></div></form>
      <div class="msg" id="lm"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <button class="btn" id="guest">로그인 없이 둘러보기 (핵심술기·시뮬레이션 체험만)</button>
    </div>`;
  const tab = (r) => { $('tL').setAttribute('aria-selected', !r); $('tR').setAttribute('aria-selected', r); $('fL').classList.toggle('hidden', r); $('fR').classList.toggle('hidden', !r); };
  $('tL').onclick = () => tab(false); $('tR').onclick = () => tab(true);
  const msg = (t, e) => { $('lm').textContent = t; $('lm').className = 'msg' + (e ? ' err' : ''); };
  const done = (r) => { session = { token: r.token, user: r.user, guest: false }; saveSession(); location.hash = '#home'; route(); };
  $('fL').onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target); msg('로그인 중…');
    try { done(await api('login', { studentNo: f.get('studentNo').trim(), password: f.get('password') })); } catch (err) { msg(err.message, true); } };
  $('fR').onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target);
    if (!f.get('consent')) return msg('기록 수집에 동의해야 가입할 수 있습니다.', true); msg('가입 중…');
    try { done(await api('register', { studentNo: f.get('studentNo').trim(), name: f.get('name').trim(), password: f.get('password'),
      classCode: f.get('classCode').trim(), school: f.get('school'), dept: f.get('dept'), grade: f.get('grade'), consent: true })); }
    catch (err) { msg(err.message, true); } };
  $('guest').onclick = () => { session = { guest: true, user: { name: '둘러보기' } }; saveSession(); location.hash = '#skills'; route(); };
}
function logout() { session = {}; saveSession(); location.hash = ''; route(); }

/* ── 홈 ── */
let progressCache = null;
async function getProgress(force) {
  if (!loggedIn()) return null;
  if (!progressCache || force) progressCache = await api('getMyProgress');
  return progressCache;
}
async function viewHome() {
  const u = session.user || {};
  M().innerHTML = `<h1>${esc(u.name || '')}님, 안녕하세요</h1><p class="sub">${loggedIn() ? esc(u.classCode) + ' · 오늘도 한 걸음씩' : '둘러보기 모드 · 기록되지 않습니다'}</p>
    <div class="grid" style="margin-top:16px" id="tiles">${tiles(null, loggedIn())}</div>`;
  try { const p = await getProgress(true); if (p) $('tiles').innerHTML = tiles(p); } catch (e) {}
}
function tiles(p, pending) {
  const pre = p && p.quiz.pretest, lastSim = p && p.sims[0];
  const skillDone = p ? Object.keys(p.skills).length : 0;
  const T = (href, ic, t, d, st) => `<a class="tile" href="${href}"><div class="ic">${ic}</div><h3>${t}</h3><div class="sub">${d}</div>${pending ? '<div class="st">진도 불러오는 중…</div>' : st ? `<div class="st">${st}</div>` : ''}</a>`;
  return [
    T('#pretest', '📝', '사전학습 퀴즈', '시뮬레이션 전 15문항 중 무작위 5문항', pre ? `최근 ${pre.last.correct}/${pre.last.total} · ${pre.count}회 응시` : '아직 풀지 않음'),
    T('sim.html', '🚨', '재난·응급 시뮬레이션', '터널 붕괴 · 심정지 환자 소생 (분기형)', lastSim ? `최근 결말 <b class="end-${String(lastSim.ending).slice(-1)}">${esc(lastSim.ending)}</b> · ${lastSim.score}점` : '아직 플레이하지 않음'),
    T('#skills', '🩺', '핵심술기', '활력징후 · 경구투약 · 피하주사 · CPR·AED', p ? `셀프 체크 ${skillDone} / ${SKILLS.length}개 술기` : `${SKILLS.length}개 술기`),
    T('#bank', '📚', '문제은행', '과목·단원별 문제 풀이', p ? `푼 문항 ${p.bank.solved}개 · 현재 정답 ${p.bank.correctNow}개` : ''),
    T('#wrong', '🔁', '오답노트', '틀린 문제만 다시 풀기', p ? `남은 오답 ${p.bank.wrongNow}개` : ''),
    T('#me', '📈', '내 기록', '퀴즈 · 시뮬레이션 · 술기 이력', '')
  ].join('');
}

/* ── 퀴즈 공통 ── */
function renderQuiz({ title, desc, questions, quizType, again }) {
  if (!questions.length) { M().innerHTML = `<h1>${esc(title)}</h1><div class="card"><p>풀 문제가 없습니다.</p></div>`; return; }
  const answers = {};
  M().innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(desc || '')}</p><div class="stack" style="margin-top:14px">` +
    questions.map((q, i) => `<div class="q" data-q="${esc(q.qid)}"><div class="no">${i + 1} / ${questions.length} · ${esc(q.subject)} · ${esc(q.unit)}</div>
      <div class="stem">${esc(q.question)}</div>
      ${q.options.map((o, k) => `<label data-k="${k + 1}"><input type="radio" name="q${i}" value="${k + 1}"><span>${'①②③④⑤'[k]} ${esc(o)}</span></label>`).join('')}
      <div class="res"></div></div>`).join('') +
    `</div><div class="sticky-bar"><span class="sub" id="cnt">0 / ${questions.length} 답함</span><button class="btn primary" id="sub" disabled>제출하고 채점</button></div>`;
  M().querySelectorAll('.q').forEach((box) => box.querySelectorAll('input').forEach((r) => r.onchange = () => {
    answers[box.dataset.q] = Number(r.value);
    const n = Object.keys(answers).length; $('cnt').textContent = `${n} / ${questions.length} 답함`; $('sub').disabled = n < questions.length;
  }));
  $('sub').onclick = async () => {
    $('sub').disabled = true; $('sub').textContent = '채점 중…';
    try {
      const r = await api('submitQuiz', { quizType, answers });
      progressCache = null;
      r.detail.forEach((d) => {
        const box = M().querySelector(`.q[data-q="${CSS.escape(d.qid)}"]`); if (!box) return;
        box.querySelectorAll('input').forEach((x) => x.disabled = true);
        box.querySelector(`label[data-k="${d.answer}"]`).classList.add('right');
        if (!d.correct) box.querySelector(`label[data-k="${d.chosen}"]`).classList.add('wrong');
        box.querySelector('.res').innerHTML = `<div class="exp"><span class="mark ${d.correct ? 'ok' : 'no'}">${d.correct ? '✓ 정답' : '✗ 오답'}</span> · 정답 ${'①②③④⑤'[d.answer - 1]}<br>${esc(d.explanation)}</div>`;
      });
      const bar = M().querySelector('.sticky-bar');
      bar.innerHTML = `<span><span class="score">${r.correctCount}</span><span class="sub"> / ${r.total} 정답</span></span>
        <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="ag">${again || '다시 풀기'}</button>${r.correctCount < r.total ? '<a class="btn" href="#wrong" style="text-decoration:none">오답노트</a>' : ''}</span>`;
      $('ag').onclick = () => route(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      toast(`${r.total}문항 중 ${r.correctCount}문항 정답`);
    } catch (e) { toast(e.message); $('sub').disabled = false; $('sub').textContent = '제출하고 채점'; }
  };
}

async function viewPretest() {
  if (!loggedIn()) return needLogin();
  loading();
  const r = await api('getQuiz', { n: 5, source: 'V8' });
  renderQuiz({ title: '사전학습 퀴즈', desc: '시뮬레이션 전 기본 지식 확인 · 15문항 중 무작위 5문항 · 다시 풀면 다른 문항이 나올 수 있습니다', questions: r.questions, quizType: 'pretest' });
}

async function viewBank() {
  if (!loggedIn()) return needLogin();
  loading();
  const meta = (await api('getBankMeta')).subjects;
  const subs = Object.keys(meta);
  M().innerHTML = `<h1>문제은행</h1><p class="sub">검수가 끝난 문항만 출제됩니다. 문항은 계속 추가됩니다.</p>
    <div class="card" style="margin-top:14px;max-width:560px">
      <label class="f">과목</label><select id="bs">${subs.map((s) => `<option value="${esc(s)}">${esc(s)} (${meta[s].total})</option>`).join('')}</select>
      <label class="f">단원</label><select id="bu"></select>
      <label class="f">문항 수</label><select id="bn"><option>5</option><option selected>10</option><option>20</option></select>
      <div class="actions"><button class="btn primary" id="go">풀기 시작</button></div></div>`;
  const fillUnits = () => { const u = meta[$('bs').value].units;
    $('bu').innerHTML = `<option value="">전체 단원 (${meta[$('bs').value].total})</option>` + Object.keys(u).map((k) => `<option value="${esc(k)}">${esc(k)} (${u[k]})</option>`).join(''); };
  if (subs.length) fillUnits(); $('bs').onchange = fillUnits;
  $('go').onclick = async () => {
    const subject = $('bs').value, unit = $('bu').value, n = Number($('bn').value); // 화면을 바꾸기 전에 값을 읽음
    loading();
    const r = await api('getQuiz', { n, subject, unit });
    renderQuiz({ title: `문제은행 · ${subject}${unit ? ' · ' + unit : ''}`, desc: `${r.questions.length}문항`, questions: r.questions, quizType: 'practice', again: '새 문제 풀기' });
  };
}

async function viewWrong() {
  if (!loggedIn()) return needLogin();
  loading();
  const r = await api('getWrongQuiz', { n: 20 });
  if (!r.total) { M().innerHTML = `<h1>오답노트</h1><div class="card"><h2>🎉 남은 오답이 없습니다</h2><p class="sub">문제은행이나 사전학습 퀴즈에서 틀린 문제가 여기에 모입니다.</p></div>`; return; }
  renderQuiz({ title: '오답노트', desc: `남은 오답 ${r.total}개 · 다시 맞히면 오답노트에서 빠집니다`, questions: r.questions, quizType: 'review', again: '남은 오답 다시 풀기' });
}

/* ── 핵심술기 ── */
async function viewSkills() {
  let p = null; try { p = await getProgress(); } catch (e) {}
  M().innerHTML = `<h1>핵심술기</h1><p class="sub">시뮬레이션에 나오는 술기를 단계별로 익히고, 실습 후 셀프 체크하세요. <span class="badge star">★ 필수</span> 항목은 평가에서 반드시 수행해야 합니다.</p>
    <div class="grid" style="margin-top:14px">${SKILLS.map((s) => {
      const c = p && p.skills[s.id];
      return `<a class="tile" href="#skill/${s.id}"><h3>${esc(s.title)}</h3><div class="sub">${esc(s.subtitle)}</div>
        <div class="chips" style="margin-top:8px"><span>난이도 ${esc(s.level)}</span><span>${esc(s.time)}</span><span>${s.steps.length}단계 · 필수 ${s.steps.filter((x) => x.star).length}</span></div>
        ${c ? `<div class="st">최근 셀프 체크 ${c.checked}/${c.total} · ${fmtDate(c.at)}</div><div class="prog"><i style="width:${c.checked / c.total * 100}%"></i></div>` : ''}</a>`;
    }).join('')}</div>`;
}

function viewSkill(id) {
  const s = SKILLS.find((x) => x.id === id); if (!s) return viewSkills();
  const key = 'skill-' + id;
  const saved = JSON.parse(localStorage.getItem(key) || '[]');
  M().innerHTML = `<a href="#skills" class="sub" style="text-decoration:none">← 핵심술기</a>
    <h1 style="margin-top:6px">${esc(s.title)}</h1><p class="sub">${esc(s.subtitle)} · 난이도 ${esc(s.level)} · 수행시간 ${esc(s.time)}</p>
    <div class="card" style="margin-top:12px"><h3>🔗 시뮬레이션 연결</h3><div class="sub">${esc(s.scenario)}</div></div>
    ${s.video ? `<video src="${esc(s.video)}" controls style="width:100%;border-radius:14px;margin-top:12px;background:#000"></video>` : ''}
    <div class="grid" style="margin-top:12px">
      <div class="card"><h3>성취목표</h3><ul>${s.goals.map((g) => `<li>${esc(g)}</li>`).join('')}</ul></div>
      <div class="card"><h3>관련 선행지식</h3><ul>${s.prior.map((g) => `<li>${esc(g)}</li>`).join('')}</ul></div>
      <div class="card"><h3>필요장비 및 물품</h3><ul>${s.supplies.map((g) => `<li>${esc(g)}</li>`).join('')}</ul></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <h2 style="margin:0">수행 단계 · 셀프 체크</h2>
        <label class="sub" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="onlyStar"> 필수(★) 항목만 보기</label></div>
      <p class="sub">실습하면서 수행한 단계를 체크하세요. 체크 상태는 이 기기에 임시 저장되고, "셀프 체크 저장"을 누르면 내 기록에 남습니다.</p>
      <ol class="steps">${s.steps.map((st, i) => `<li class="${st.star ? 'star' : ''}${saved.includes(i) ? ' done' : ''}" data-i="${i}">
        <span class="n">${i + 1}</span><div><label><input type="checkbox" ${saved.includes(i) ? 'checked' : ''}><span class="txt">${st.star ? '<span class="badge star">★ 필수</span> ' : ''}${esc(st.t)}</span></label>
        ${st.note ? `<div class="note">※ ${esc(st.note)}</div>` : ''}</div></li>`).join('')}</ol>
      <div class="sticky-bar"><span class="sub" id="sk">0 / ${s.steps.length}</span>
        <span style="display:flex;gap:8px"><button class="btn" id="clr">초기화</button><button class="btn primary" id="sv">셀프 체크 저장</button></span></div>
    </div>`;
  const update = () => {
    const on = [...M().querySelectorAll('.steps li')].filter((li) => li.querySelector('input').checked).map((li) => Number(li.dataset.i));
    M().querySelectorAll('.steps li').forEach((li) => li.classList.toggle('done', on.includes(Number(li.dataset.i))));
    localStorage.setItem(key, JSON.stringify(on));
    const missed = s.steps.map((x, i) => x.star && !on.includes(i) ? i + 1 : null).filter(Boolean);
    $('sk').innerHTML = `${on.length} / ${s.steps.length} 수행${missed.length ? ` · <span style="color:var(--warn)">빠진 필수 ${missed.join(', ')}번</span>` : ' · 필수 항목 모두 수행'}`;
    return { on, missed };
  };
  M().querySelectorAll('.steps input').forEach((c) => c.onchange = update);
  $('onlyStar').onchange = (e) => M().querySelectorAll('.steps li').forEach((li) => li.classList.toggle('hidden', e.target.checked && !li.classList.contains('star')));
  $('clr').onclick = () => { M().querySelectorAll('.steps input').forEach((c) => c.checked = false); update(); };
  $('sv').onclick = async () => {
    if (!loggedIn()) return toast('로그인하면 기록에 저장됩니다.');
    const { on, missed } = update();
    $('sv').disabled = true;
    try { await api('saveSkillCheck', { skill: s.id, checked: on.length, total: s.steps.length, missedCritical: missed }); progressCache = null; toast('셀프 체크를 저장했습니다.'); }
    catch (e) { toast(e.message); } finally { $('sv').disabled = false; }
  };
  update();
}

/* ── 내 기록 ── */
async function viewMe() {
  if (!loggedIn()) return needLogin();
  loading();
  const p = await getProgress(true);
  const qt = { pretest: '사전학습 퀴즈', practice: '문제은행', review: '오답노트' };
  const endLabel = { 'END-A': '최선의 소생', 'END-B': '지연된 소생', 'END-C': '소생 실패', 'END-D': '구조자 부상', 'END-E': '2차 사고' };
  M().innerHTML = `<h1>내 기록</h1><p class="sub">${esc(session.user.name)} · ${esc(session.user.studentNo)} · ${esc(session.user.classCode)}</p>
    <div class="grid" style="margin-top:14px">
      <div class="card"><h3>문제 풀이</h3><div class="score">${p.bank.correctNow}<span class="sub"> / ${p.bank.solved} 정답</span></div><div class="sub">남은 오답 ${p.bank.wrongNow}개</div></div>
      <div class="card"><h3>시뮬레이션</h3><div class="score">${p.sims.length}<span class="sub"> 회</span></div><div class="sub">${p.sims.length ? '첫 플레이: ' + esc(p.sims[p.sims.length - 1].ending) + ' · ' + p.sims[p.sims.length - 1].score + '점' : '아직 없음'}</div></div>
      <div class="card"><h3>핵심술기</h3><div class="score">${Object.keys(p.skills).length}<span class="sub"> / ${SKILLS.length} 체크</span></div></div>
    </div>
    <div class="card" style="margin-top:12px"><h2>퀴즈</h2>${Object.keys(p.quiz).length ? `<table><tr><th>종류</th><th class="n">응시</th><th class="n">누적 정답률</th><th class="n">최근</th></tr>${Object.entries(p.quiz).map(([k, v]) =>
      `<tr><td>${esc(qt[k] || k)}</td><td class="n">${v.count}</td><td class="n">${v.total ? Math.round(v.correct / v.total * 100) : 0}%</td><td class="n">${v.last.correct}/${v.last.total}</td></tr>`).join('')}</table>` : '<p class="sub">아직 없음</p>'}</div>
    <div class="card" style="margin-top:12px"><h2>시뮬레이션</h2>${p.sims.length ? `<table><tr><th>일시</th><th>결말</th><th class="n">점수</th><th class="n">압박 지연</th></tr>${p.sims.map((s) =>
      `<tr><td>${fmtDate(s.at)}${s.first ? ' <span class="badge">첫 플레이 · 성적 기준</span>' : ''}</td><td class="end-${String(s.ending).slice(-1)}">${esc(s.ending)} ${esc(endLabel[s.ending] || '')}</td><td class="n">${s.score}</td><td class="n">${s.cprDelay}초</td></tr>`).join('')}</table>` : '<p class="sub">아직 없음 · <a href="sim.html">시뮬레이션 하러 가기</a></p>'}</div>
    <div class="card" style="margin-top:12px"><h2>핵심술기 셀프 체크</h2><table><tr><th>술기</th><th class="n">수행</th><th>빠진 필수 단계</th><th class="n">일시</th></tr>${SKILLS.map((s) => {
      const c = p.skills[s.id];
      return `<tr><td><a href="#skill/${s.id}">${esc(s.title)}</a></td><td class="n">${c ? c.checked + '/' + c.total : '–'}</td><td>${c ? (c.missedCritical ? esc(c.missedCritical) + '번' : '없음') : ''}</td><td class="n">${c ? fmtDate(c.at) : ''}</td></tr>`; }).join('')}</table></div>`;
}

/* ── 라우터 ── */
async function route() {
  if (!session.token && !session.guest) return viewLogin();
  $('hdr').classList.remove('hidden');
  $('who').innerHTML = `${esc(session.user.name)}${session.user.classCode ? ' · ' + esc(session.user.classCode) : ''}<button onclick="logout()">${session.guest ? '로그인' : '로그아웃'}</button>`;
  const h = location.hash || '#home';
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', h.startsWith(a.getAttribute('href')) && a.getAttribute('href') !== 'sim.html'));
  window.scrollTo(0, 0);
  try {
    if (h.startsWith('#skill/')) return viewSkill(h.slice(7));
    ({ '#home': viewHome, '#pretest': viewPretest, '#bank': viewBank, '#wrong': viewWrong, '#skills': viewSkills, '#me': viewMe }[h] || viewHome)();
  } catch (e) { M().innerHTML = `<div class="card"><p class="msg err">${esc(e.message)}</p></div>`; }
}
window.addEventListener('hashchange', () => route());
window.addEventListener('unhandledrejection', (e) => { M().innerHTML = `<div class="card"><p class="msg err">${esc(e.reason && e.reason.message || e.reason)}</p><p class="sub">잠시 후 다시 시도해 주세요.</p></div>`; });
route();
</script>
</body>
</html>
